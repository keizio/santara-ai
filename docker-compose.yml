services:
  postgres:
    image: postgres:16-alpine
    container_name: santara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: santara
      POSTGRES_PASSWORD: santara
      POSTGRES_DB: santara
    ports:
      - "5432:5432"
    volumes:
      - santara-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U santara -d santara"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  santara-pgdata:
